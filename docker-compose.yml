# Caddy (running in Docker on the VPS) reaches these containers over the
# shared proxy network by their aliases: pennywise-web:80, pennywise-api:4100.
services:
  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      PORT: 4100
      DB_PATH: /data/expenses.db
    volumes:
      - api-data:/data
    networks:
      proxy:
        aliases: [pennywise-api]

  web:
    build:
      context: ./chat-ui
      args:
        VITE_API_URL: https://api.aipennywisetrackr.com
    restart: unless-stopped
    networks:
      proxy:
        aliases: [pennywise-web]

volumes:
  api-data:

networks:
  caddy:
    external: true
    name: proxy
