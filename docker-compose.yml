services:
  backend:
    build:
      context: ./server
    container_name: "pennywise-api"
    env_file:
      - ./server/.env
    environment:
      - PORT=4100
      - DB_PATH=/data/expenses.db
    volumes:
      - api-data:/data
    expose:
      - "4100"
    restart: unless-stopped
    networks:
      - default
      - web

  frontend:
    build:
      context: ./chat-ui
      args:
        VITE_API_URL: https://api.aipennywisetrackr.com
    container_name: "pennywise-web"
    expose:
      - "80"                   # nginx inside the container
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - web

volumes:
  api-data:

networks:
  web:
    external: true